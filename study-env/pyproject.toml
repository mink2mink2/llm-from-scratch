# Environment for the book's notebooks (rickiepark/llm-from-scratch), kept apart from the book's own files.
# One lock for every machine: Linux/Windows get torch built for CUDA 12.8 (driver >= 570, RTX 30xx..50xx), macOS gets the default build (MPS).
[project]
name = "llm-study-env"
version = "1"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.11.0",
  "tensorflow>=2.18.0",
  "jupyterlab>=4.0",
  "tiktoken>=0.5.1",
  "matplotlib>=3.7.1",
  "tqdm>=4.66.1",
  "numpy>=1.26",
  "pandas>=2.2.1",
  "psutil>=5.9.5",
  "pytest>=8.3.5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

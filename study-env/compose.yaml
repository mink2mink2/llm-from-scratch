# Run on a CUDA machine (m2Msi, the 5070 Ti PC):  docker compose -f study-env/compose.yaml up -d --build
# Jupyter listens on 127.0.0.1 only; reach it through an SSH tunnel.
name: llm-study
services:
  lab:
    build: {context: .., dockerfile: study-env/Dockerfile}
    image: llm-study:1
    container_name: llm-study
    restart: unless-stopped
    env_file: ["${HOME}/.config/llm-study/jupyter.env"]
    volumes:
      - ..:/work
      - ${HOME}/.config/llm-study/git:/home/study/.config/git
      - ${HOME}/.config/llm-study/gitconfig:/home/study/.gitconfig:ro
    ports: ["127.0.0.1:8888:8888"]
    gpus: all
